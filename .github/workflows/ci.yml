name: backend-ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install backend
        run: python -m pip install -e "./backend[dev]"
      - name: Repository hygiene
        run: python scripts/check_repository.py
      - name: Lint
        run: ruff check backend/src backend/tests scripts
      - name: Test
        run: pytest

